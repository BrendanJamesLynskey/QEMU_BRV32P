# CI: build QEMU at the pinned release with the patch series, then run the
# BRV32P tests on it: the core repo's ISA tests, the SoC firmware, and the
# machine tests. Three jobs: `test` (the Q1 job, which now also builds the
# execlog plugin), `spike` (Spike at the core repo's pinned revision, cached)
# and `lockstep` (the custom-instruction tests on QEMU and on Spike, compared
# instruction by instruction: tests/run_lockstep.sh) and `three-platforms` (one ELF
# per program on QEMU, Spike and the RTL under Icarus, compared: tests/run_three.sh).
name: CI

# The heavy jobs run once per change: on pull requests, and on pushes to main
# (not on every push to a branch that has a pull request), and a newer run of
# the same ref cancels the older one
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REPO_URL: BrendanJamesLynskey/RISCV_RV32IMC_5stage
  RISCV_TESTS_REV: 3df703cd52d5f0d8224e3c50bf03c6cb70efff98    # riscv-tests, as the core repo's CI
  CORE_REV: bc75bf84c23a91e48bed001cebf0387f914c16c6    # the core repo's commit the three-platforms job is run against
  SPIKE_REV: fb225a5f5e50d889305b8ef6e53c2b66d9e765f7          # riscv-isa-sim, as the core repo's CI

jobs:
  test:
    name: Build QEMU and run the BRV32P tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev python3-venv python3-pip ccache

      - name: Core repo (RTL tests, firmware generator, env and linker script)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO_URL }}
          path: core

      - name: Restore the QEMU build
        id: qemu-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/qemu/qemu-system-riscv32
            build/qemu/contrib/plugins/libexeclog.so
          key: qemu-${{ hashFiles('QEMU_VERSION', 'patches/*.patch', 'scripts/build.sh') }}

      - name: Build QEMU (pinned release plus patches)
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" scripts/build.sh

      # Saved here, not at the end of the job, so that the lockstep job has the
      # build even if a test below fails
      - name: Save the QEMU build
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/qemu/qemu-system-riscv32
            build/qemu/contrib/plugins/libexeclog.so
          key: qemu-${{ hashFiles('QEMU_VERSION', 'patches/*.patch', 'scripts/build.sh') }}

      - name: QEMU version and machine
        run: |
          build/qemu/qemu-system-riscv32 --version
          build/qemu/qemu-system-riscv32 -M help | grep brv32p
          build/qemu/qemu-system-riscv32 -cpu help | grep brv32p
          test -f build/qemu/contrib/plugins/libexeclog.so

      - name: ISA tests (riscv-tests and the core repo's directed tests) and rv32mi
        run: |
          export CORE_REPO="$PWD/core" RISCV_TESTS="$PWD/core/tests/isa/riscv-tests"
          git clone -q https://github.com/riscv-software-src/riscv-tests.git "$RISCV_TESTS"
          git -C "$RISCV_TESTS" checkout -q "$RISCV_TESTS_REV"
          git -C "$RISCV_TESTS" submodule update -q --init env
          tests/run_isa.sh

      - name: Machine tests (SoC firmware, timer, UART, GPIO)
        run: CORE_REPO="$PWD/core" RISCV_TESTS="$PWD/core/tests/isa/riscv-tests" tests/run_machine.py

      - name: Short report
        if: always()
        run: |
          {
            echo "## BRV32P QEMU model"
            echo "QEMU $(cat QEMU_VERSION) plus $(ls patches/*.patch | wc -l) patches"
            echo '```'
            grep -h -E "^suite|passed" tests/build/isa/results.txt tests/build/machine/results.txt || true
            grep -h -E "FAIL|BUILD" tests/build/isa/results.txt tests/build/machine/results.txt || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > tests/build/report.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brv32p-qemu-results
          path: |
            tests/build/report.md
            tests/build/isa/results.txt
            tests/build/machine/results.txt

  # Spike at the core repo's pinned revision, with the headers the model of the
  # custom extensions compiles against. Its own job, so that the (slow) build
  # is cached whatever the other jobs do.
  spike:
    name: Build Spike (cached)
    runs-on: ubuntu-24.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Restore Spike
        id: spike-cache
        uses: actions/cache@v4
        with:
          path: ~/spike
          key: spike-${{ env.SPIKE_REV }}-ubuntu-24.04-with-headers

      - name: Build Spike
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike-src
          cd /tmp/spike-src
          git checkout "$SPIKE_REV"
          git submodule update --init --depth 1
          mkdir build && cd build
          ../configure --prefix="$HOME/spike" --with-boost=no
          make -j"$(nproc)"
          make install
          # Keep the source and generated headers: the core repo's model of the
          # custom extensions compiles against them (tools/spike_xbrvdsp/build.sh)
          mkdir -p "$HOME/spike/src/build"
          cp -rL ../riscv ../fesvr ../softfloat ../fdt "$HOME/spike/src/"   # -L: softfloat links into its submodule
          cp config.h insn_list.h "$HOME/spike/src/build/"

  # The custom-instruction tests on QEMU and on Spike (with the core repo's
  # model of the extensions), compared instruction by instruction
  lockstep:
    name: Lockstep with Spike (custom-instruction tests)
    needs: [test, spike]
    if: ${{ !cancelled() && needs.spike.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf device-tree-compiler libglib2.0-dev

      - name: Core repo (the tests, the env and the Spike model)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO_URL }}
          path: core

      - name: Restore the QEMU build (from the test job)
        id: qemu-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/qemu/qemu-system-riscv32
            build/qemu/contrib/plugins/libexeclog.so
          key: qemu-${{ hashFiles('QEMU_VERSION', 'patches/*.patch', 'scripts/build.sh') }}
          fail-on-cache-miss: true

      - name: Restore Spike
        uses: actions/cache@v4
        with:
          path: ~/spike
          key: spike-${{ env.SPIKE_REV }}-ubuntu-24.04-with-headers
          fail-on-cache-miss: true

      - name: Build the Spike model of the custom extensions (libxbrvdsp.so, from the core repo)
        run: core/tools/spike_xbrvdsp/build.sh "$HOME/spike/src" "$HOME/spike/src/build" "$PWD/build/xbrvdsp"

      - name: Lockstep with Spike (QEMU's execlog against Spike's commit log)
        run: |
          export CORE_REPO="$PWD/core" RISCV_TESTS="$PWD/core/tests/isa/riscv-tests"
          git clone -q https://github.com/riscv-software-src/riscv-tests.git "$RISCV_TESTS"
          git -C "$RISCV_TESTS" checkout -q "$RISCV_TESTS_REV"
          git -C "$RISCV_TESTS" submodule update -q --init env
          SPIKE="$HOME/spike/bin/spike" XBRVDSP_LIB="$PWD/build/xbrvdsp/libxbrvdsp.so" tests/run_lockstep.sh

      - name: Short report
        if: always()
        run: |
          {
            echo "## BRV32P QEMU model: lockstep with Spike"
            echo '```'
            grep -h -E "^suite|passed" tests/build/lockstep/results.txt || true
            grep -h -E "FAIL|BUILD|MISMATCH" tests/build/lockstep/results.txt || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > tests/build/lockstep/report.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brv32p-qemu-lockstep
          path: |
            tests/build/lockstep/report.md
            tests/build/lockstep/results.txt
            tests/build/lockstep/*.S
            tests/build/lockstep/*.qemu
            tests/build/lockstep/*.spike

  # One ELF per program, built once and run on QEMU, on Spike (with the core
  # repo's model of the custom extensions) and on the RTL (the core repo's
  # tb_isa.v under Icarus), the results compared: tests/run_three.sh. The core
  # repo is checked out at CORE_REV so the RTL is the one the results are for.
  three-platforms:
    name: One ELF on QEMU, Spike and the RTL
    needs: [test, spike]
    if: ${{ !cancelled() && needs.spike.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the RISC-V toolchain and Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf iverilog device-tree-compiler libglib2.0-dev

      - name: Core repo (the RTL, the tests, the env and the Spike model), at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO_URL }}
          ref: ${{ env.CORE_REV }}
          path: core

      - name: Restore the QEMU build (from the test job)
        uses: actions/cache/restore@v4
        with:
          path: |
            build/qemu/qemu-system-riscv32
            build/qemu/contrib/plugins/libexeclog.so
          key: qemu-${{ hashFiles('QEMU_VERSION', 'patches/*.patch', 'scripts/build.sh') }}
          fail-on-cache-miss: true

      - name: Restore Spike
        uses: actions/cache@v4
        with:
          path: ~/spike
          key: spike-${{ env.SPIKE_REV }}-ubuntu-24.04-with-headers
          fail-on-cache-miss: true

      - name: Build the Spike model of the custom extensions (libxbrvdsp.so, from the core repo)
        run: core/tools/spike_xbrvdsp/build.sh "$HOME/spike/src" "$HOME/spike/src/build" "$PWD/build/xbrvdsp"

      - name: Build every program once and run it on the three platforms
        run: |
          export CORE_REPO="$PWD/core" RISCV_TESTS="$PWD/core/tests/isa/riscv-tests"
          git clone -q https://github.com/riscv-software-src/riscv-tests.git "$RISCV_TESTS"
          git -C "$RISCV_TESTS" checkout -q "$RISCV_TESTS_REV"
          git -C "$RISCV_TESTS" submodule update -q --init env
          SPIKE="$HOME/spike/bin/spike" XBRVDSP_LIB="$PWD/build/xbrvdsp/libxbrvdsp.so" tests/run_three.sh

      - name: A mismatch is caught (corrupted copies of the results)
        run: CORE_REPO="$PWD/core" tests/three_compare.py tests/build/three --selftest

      - name: Report
        if: always()
        run: |
          {
            echo "## BRV32P: one ELF, three platforms"
            echo "QEMU $(cat QEMU_VERSION) plus $(ls patches/*.patch | wc -l) patches; core repo at ${CORE_REV:0:7}"
            echo '```'
            cat tests/build/three/results.txt || true
            echo '```'
            echo
            cat tests/build/three/results_q3.md || true
            echo
            echo "SHA-256 of the ELFs"
            echo '```'
            cat tests/build/three/sha256.txt || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > /dev/null

      - name: Upload the ELFs, the table and the logs
        if: always()
        run: |
          cd tests/build/three
          tar czf logs.tgz *.rtl.* *.qemu.* *.spike.* *.dis *.meta 2> /dev/null || true
          mkdir -p ../three-upload
          cp *.elf sha256.txt results.txt results_q3.md programs.txt logs.tgz ../three-upload/ || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brv32p-three-platforms
          path: tests/build/three-upload

  linux-boot:
    name: Boot Linux on brv32p-linux (OpenSBI, kernel, BusyBox initramfs)
    needs: [test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio unzip rsync wget \
            file python3

      - name: Restore the QEMU build (from the test job)
        uses: actions/cache/restore@v4
        with:
          path: |
            build/qemu/qemu-system-riscv32
            build/qemu/contrib/plugins/libexeclog.so
          key: qemu-${{ hashFiles('QEMU_VERSION', 'patches/*.patch', 'scripts/build.sh') }}
          fail-on-cache-miss: true

      # The kernel, OpenSBI and the initramfs, keyed on the build script, the configs, the DT and the OpenSBI patch
      - name: Restore the images
        id: images
        uses: actions/cache/restore@v4
        with:
          path: linux/out
          key: linux-images-${{ hashFiles('linux/build.sh', 'linux/brv32p_linux_defconfig', 'linux/kernel.fragment', 'linux/brv32p-linux.dts', 'linux/patches/**', 'linux/overlay/**') }}

      - name: Build the images (Buildroot toolchain, kernel, OpenSBI, BusyBox)
        if: steps.images.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" linux/build.sh

      - name: Save the images
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: linux/out
          key: linux-images-${{ hashFiles('linux/build.sh', 'linux/brv32p_linux_defconfig', 'linux/kernel.fragment', 'linux/brv32p-linux.dts', 'linux/patches/**', 'linux/overlay/**') }}

      - name: Boot test
        run: linux/boot_test.sh

      - name: Upload the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brv32p-linux-boot
          path: |
            linux/out/boot.log
            linux/out/versions.txt
